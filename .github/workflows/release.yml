name: Release

on:
  workflow_dispatch:
    # Manual trigger only — production releases from main branch only.
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '189676910689'
  DEPLOY_ROLE: arn:aws:iam::189676910689:role/github-actions-deploy-production
  CLOUDFRONT_DISTRIBUTION_ID: E3QAA3BBMD2WVG
  APT_BUCKET: robotops-apt-pub-production
  APT_REPO_URL: https://apt.robotops.com

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release is from main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production releases can only be created from main branch"
            echo "Current branch: ${{ github.ref }}"
            echo "For development releases, use the Release Development workflow"
            exit 1
          fi
          echo "📦 Production release from main branch"

  tag-packages:
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # create per-package tags + releases
    steps:
      - uses: actions/checkout@v4

      # Monorepo tagging: each package is tagged independently as <pkg>/v<ver>
      # from its own package.xml version. Tags that already exist are skipped so
      # re-running only releases packages whose version actually bumped.
      - name: Create per-package tags + GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pkgdir in packages/*/; do
            pkg=$(basename "$pkgdir")
            ver=$(grep -oP '(?<=<version>)[^<]+' "${pkgdir}package.xml")
            tag="${pkg}/v${ver}"
            if git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
              echo "Tag ${tag} already exists — skipping."
              continue
            fi
            echo "Tagging ${tag}"
            gh release create "${tag}" \
              --title "${pkg} v${ver}" \
              --notes "Release of ${pkg} v${ver}. See CHANGELOG.rst. Debs: ${APT_REPO_URL}" \
              || echo "::warning::Failed to create release for ${tag}"
          done

  build-packages:
    runs-on: ${{ matrix.target.runner }}
    needs: guard
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        # Every package, across every (ros_distro, arch) target. bloom encodes
        # the distro in the deb name (ros-<distro>-<pkg-dashes>_<ver>_<arch>.deb)
        # so jazzy (Noble) and humble (Jammy) debs never collide. See ROB-325 in
        # rmw_robotops for the arch/distro coupling rationale.
        package:
          - robotops_trace_semconv
          - robotops_trace_rclcpp
          - robotops_trace_rclpy
          - robotops_trace_bt_cpp
          - robotops_trace_ros2_control
          - robotops_trace_moveit
        target:
          - { arch: amd64, runner: ubuntu-24.04,     ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: humble, os_version: jammy }
          - { arch: amd64, runner: ubuntu-22.04,     ros_distro: humble, os_version: jammy }
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' packages/${{ matrix.package }}/package.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (${{ matrix.target.ros_distro }}/${{ matrix.target.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          build-args: |
            APT_REPO_URL=${{ env.APT_REPO_URL }}
            ROS_DISTRO=${{ matrix.target.ros_distro }}
          cache-from: type=gha,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}

      # NOTE: rosdep install of robotops_trace_cpp / robotops_trace_python WILL
      # fail here until those cores are published to apt/PyPI. This release
      # workflow is structurally correct; it is expected to fail at dep
      # resolution until the cores ship (see README "Status"). Not faked green.
      - name: Bloom + build Debian package for ${{ matrix.package }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/ws/src/robotops-trace-integrations \
            -v ${{ github.workspace }}:/output \
            rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }} bash -c "
              set -e && \
              cd /ws && \
              rosdep update && \
              rosdep install --from-paths src/robotops-trace-integrations/packages/${{ matrix.package }} --ignore-src -r -y --rosdistro ${{ matrix.target.ros_distro }} && \
              cd /ws/src/robotops-trace-integrations/packages/${{ matrix.package }} && \
              bloom-generate rosdebian --os-name ubuntu --os-version ${{ matrix.target.os_version }} --ros-distro ${{ matrix.target.ros_distro }} && \
              dpkg-buildpackage -us -uc -b && \
              cp ../*.deb /output/ || (cd /ws/src/robotops-trace-integrations/packages && cp *.deb /output/)
            "

      - name: Find built package
        id: deb
        run: |
          pkg_dashes=$(echo "${{ matrix.package }}" | tr '_' '-')
          DEB_FILE=$(ls ros-${{ matrix.target.ros_distro }}-${pkg_dashes}_*_*.deb | head -n1)
          echo "file=$DEB_FILE" >> $GITHUB_OUTPUT
          echo "Built package: $DEB_FILE"

      - name: Upload Debian package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.package }}-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          path: ${{ steps.deb.outputs.file }}
          retention-days: 1

  publish-debian:
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # AWS OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Flatten every (package, ros_distro, arch) deb into one directory. The
      # shared publish-debian-s3 action adds them all to the single `robotops`
      # aptly repo published to every Ubuntu codename — per-package debs give
      # customers à-la-carte install (monorepo source != monolith install).
      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          path: ./packages-out
          merge-multiple: true

      - name: List downloaded packages
        run: ls -lh ./packages-out/

      - name: Publish Debian packages to S3
        uses: ./.github/actions/publish-debian-s3
        with:
          deb-files: './packages-out/*.deb'
          apt-bucket: ${{ env.APT_BUCKET }}
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "## Debian Package Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          for deb in ./packages-out/*.deb; do
            echo "- $(basename $deb)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APT Repository: https://apt.robotops.com" >> $GITHUB_STEP_SUMMARY

  dry-run-summary:
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run summary
        run: |
          echo "## Dry Run — per-package versions" >> $GITHUB_STEP_SUMMARY
          for pkgdir in packages/*/; do
            pkg=$(basename "$pkgdir")
            ver=$(grep -oP '(?<=<version>)[^<]+' "${pkgdir}package.xml")
            echo "- ${pkg}: v${ver} → tag ${pkg}/v${ver}" >> $GITHUB_STEP_SUMMARY
          done
