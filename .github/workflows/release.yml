name: Release

on:
  workflow_dispatch:
    # Manual trigger only — production releases from main branch only.
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '189676910689'
  DEPLOY_ROLE: arn:aws:iam::189676910689:role/github-actions-deploy-production
  CLOUDFRONT_DISTRIBUTION_ID: E3QAA3BBMD2WVG
  APT_BUCKET: robotops-apt-pub-production
  APT_REPO_URL: https://apt.robotops.com

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release is from main branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production releases can only be created from main branch"
            echo "Current branch: ${{ github.ref }}"
            echo "For development releases, use the Release Development workflow"
            exit 1
          fi
          echo "📦 Production release from main branch"

  # ──────────────────────────────────────────────────────────────────────────
  # Implemented-package allowlist (ROB-437)
  # ──────────────────────────────────────────────────────────────────────────
  # Single source of truth for which packages are releasable, in TOPOLOGICAL
  # order (dependencies first). Both the build matrix and the post-publish
  # tagging job consume this list. An explicit allowlist is used instead of
  # auto-detecting packages/*/ because the stub/scaffold packages are not
  # releasable yet — silently failing/half-releasing them is worse than not
  # releasing them.
  #
  # Order matters: robotops_trace_semconv is the base of the dependency graph
  # and MUST be built (and its deb installed) before robotops_trace_rclcpp,
  # which depends on it (ROB-437: "Could not resolve rosdep key
  # 'robotops_trace_semconv'").
  #
  # To add a package once its implementation merges, append it here AFTER its
  # in-repo dependencies:
  #   * robotops_trace_bt_cpp  — ADDED (ROB-424 merged; C++, depends on semconv).
  #   * robotops_trace_rclpy   — HOLD: it's ament_python and its deb depends on the
  #     Python core (python3-robotops-trace), which isn't published to apt/PyPI yet.
  #     Add once the Python core publishes (PyPI org/Trusted-Publisher setup).
  # KEEP OUT until implemented (still stubs): robotops_trace_ros2_control,
  # robotops_trace_moveit.
  prepare:
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      packages: ${{ steps.set.outputs.packages }}
    steps:
      - id: set
        run: |
          PACKAGES="robotops_trace_semconv robotops_trace_rclcpp robotops_trace_bt_cpp"
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "Releasable packages (topo order): ${PACKAGES}"

  build-packages:
    runs-on: ${{ matrix.target.runner }}
    needs: [guard, prepare]
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        # Matrix is over TARGETS only. Each job builds the full allowlist
        # (needs.prepare.outputs.packages) in topological order on ONE runner so
        # in-repo sibling dependencies are available: each freshly built deb is
        # installed before the next (dependent) package builds (ROB-437). bloom
        # encodes the distro in the deb name
        # (ros-<distro>-<pkg-dashes>_<ver>_<arch>.deb) so jazzy (Noble) and
        # humble (Jammy) debs never collide. See ROB-325 in rmw_robotops for the
        # arch/distro coupling rationale.
        target:
          - { arch: amd64, runner: ubuntu-24.04,     ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: humble, os_version: jammy }
          - { arch: amd64, runner: ubuntu-22.04,     ros_distro: humble, os_version: jammy }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (${{ matrix.target.ros_distro }}/${{ matrix.target.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          build-args: |
            APT_REPO_URL=${{ env.APT_REPO_URL }}
            ROS_DISTRO=${{ matrix.target.ros_distro }}
          cache-from: type=gha,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}

      # Dependency-aware, deps-first build (ROB-437). Build each allowlisted
      # package's deb in topological order on this single runner. After each
      # package builds, its deb is installed into the image so that dependent
      # packages (e.g. rclcpp → semconv) resolve the sibling at rosdep AND at
      # cmake find_package() time. The robotops_trace_semconv rosdep rule baked
      # into the Dockerfile maps the key to the now-installed deb.
      - name: Bloom + build Debian packages (deps-first)
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          ROS_DISTRO: ${{ matrix.target.ros_distro }}
          OS_VERSION: ${{ matrix.target.os_version }}
        run: |
          docker run --rm \
            -e PACKAGES \
            -e ROS_DISTRO \
            -e OS_VERSION \
            -v ${{ github.workspace }}:/ws/src/robotops-trace-integrations \
            -v ${{ github.workspace }}/packages-out:/output \
            rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }} bash -c '
              set -eo pipefail
              cd /ws
              rosdep update
              REPO=src/robotops-trace-integrations
              for pkg in $PACKAGES; do
                echo "::group::Building $pkg ($ROS_DISTRO/$OS_VERSION)"
                pkgdir="$REPO/packages/$pkg"
                rosdep install --from-paths "$pkgdir" --ignore-src -r -y \
                  --rosdistro "$ROS_DISTRO" \
                  --skip-keys "robotops_trace_python ament_python"
                ( cd "$pkgdir" \
                  && bloom-generate rosdebian --os-name ubuntu \
                       --os-version "$OS_VERSION" --ros-distro "$ROS_DISTRO" \
                  && dpkg-buildpackage -us -uc -b )
                for deb in "$REPO/packages/"*.deb; do
                  echo "Built $deb"
                  cp "$deb" /output/
                  # readlink -f → absolute path so apt treats it as a local file
                  # (a bare relative path is interpreted as a package name).
                  apt-get install -y --allow-downgrades "$(readlink -f "$deb")"
                done
                rm -f "$REPO/packages/"*.deb
                echo "::endgroup::"
              done
              echo "All debs:"; ls -lh /output/
            '

      - name: Upload Debian packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          path: packages-out/*.deb
          retention-days: 1

  publish-debian:
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write  # AWS OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # Flatten every (package, ros_distro, arch) deb into one directory. The
      # shared publish-debian-s3 action adds them all to the single `robotops`
      # aptly repo published to every Ubuntu codename — per-package debs give
      # customers à-la-carte install (monorepo source != monolith install).
      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-packages-*
          path: ./packages-out
          merge-multiple: true

      - name: List downloaded packages
        run: ls -lh ./packages-out/

      - name: Publish Debian packages to S3
        uses: ./.github/actions/publish-debian-s3
        with:
          deb-files: './packages-out/*.deb'
          apt-bucket: ${{ env.APT_BUCKET }}
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "## Debian Package Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          for deb in ./packages-out/*.deb; do
            echo "- $(basename $deb)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APT Repository: https://apt.robotops.com" >> $GITHUB_STEP_SUMMARY

  # Tag AFTER a successful publish (ROB-437). Previously tag-packages ran before
  # the build (needs: guard), so a failed build/publish left dangling
  # per-package tags + GitHub releases that blocked re-release (the
  # skip-if-exists check matched the stale tag). Now tags are created only once
  # the debs are actually published, and only for the implemented allowlist.
  # Monorepo tagging: each package is tagged independently as <pkg>/v<ver> from
  # its own package.xml version. Idempotent: existing tags are skipped so
  # re-running only releases packages whose version actually bumped.
  tag-packages:
    runs-on: ubuntu-latest
    needs: [prepare, publish-debian]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write  # create per-package tags + releases
    steps:
      - uses: actions/checkout@v4
      - name: Create per-package tags + GitHub releases (post-publish)
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          for pkg in $PACKAGES; do
            ver=$(grep -oP '(?<=<version>)[^<]+' "packages/${pkg}/package.xml")
            tag="${pkg}/v${ver}"
            if git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
              echo "Tag ${tag} already exists — skipping."
              continue
            fi
            echo "Tagging ${tag}"
            gh release create "${tag}" \
              --title "${pkg} v${ver}" \
              --notes "Release of ${pkg} v${ver}. See CHANGELOG.rst. Debs: ${APT_REPO_URL}" \
              || echo "::warning::Failed to create release for ${tag}"
          done

  dry-run-summary:
    runs-on: ubuntu-latest
    needs: guard
    if: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Dry run summary
        run: |
          echo "## Dry Run — per-package versions" >> $GITHUB_STEP_SUMMARY
          for pkgdir in packages/*/; do
            pkg=$(basename "$pkgdir")
            ver=$(grep -oP '(?<=<version>)[^<]+' "${pkgdir}package.xml")
            echo "- ${pkg}: v${ver} → tag ${pkg}/v${ver}" >> $GITHUB_STEP_SUMMARY
          done
