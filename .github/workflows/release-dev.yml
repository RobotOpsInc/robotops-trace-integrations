name: Release Development

on:
  workflow_dispatch:
    # Manual trigger only — development pre-releases from development branch only.
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing)'
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '717949299175'
  DEPLOY_ROLE: arn:aws:iam::717949299175:role/github-actions-deploy-development
  CLOUDFRONT_DISTRIBUTION_ID: EE9YB1UW7HRUQ
  APT_BUCKET: robotops-apt-pub-development
  APT_REPO_URL: https://apt.development.robotops.com

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release is from development branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/development" ]]; then
            echo "::error::Development releases can only be created from development branch"
            echo "Current branch: ${{ github.ref }}"
            exit 1
          fi
          echo "🧪 Development pre-release from development branch"

  # ──────────────────────────────────────────────────────────────────────────
  # Implemented-package allowlist (ROB-437)
  # ──────────────────────────────────────────────────────────────────────────
  # Single source of truth for which packages are releasable, in TOPOLOGICAL
  # order (dependencies first). Both the build matrix and the post-publish
  # tagging job consume this list. An explicit allowlist is used instead of
  # auto-detecting packages/*/ because the stub/scaffold packages are not
  # releasable yet and silently failing/half-releasing them is worse than not
  # releasing them.
  #
  # Order matters: robotops_trace_semconv is the base of the dependency graph
  # and MUST be built (and its deb installed) before robotops_trace_rclcpp,
  # which depends on it (ROB-437: "Could not resolve rosdep key
  # 'robotops_trace_semconv'").
  #
  # To add a package once its implementation merges, append it here AFTER its
  # in-repo dependencies:
  #   * robotops_trace_bt_cpp  — ADDED (ROB-424 merged; C++, depends on semconv).
  #   * robotops_trace_rclpy   — HOLD: it's ament_python and its deb depends on the
  #     Python core (python3-robotops-trace), which isn't published to apt/PyPI yet.
  #     Add once the Python core publishes (PyPI org/Trusted-Publisher setup).
  # KEEP OUT until implemented (still stubs): robotops_trace_ros2_control,
  # robotops_trace_moveit.
  prepare:
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      packages: ${{ steps.set.outputs.packages }}
      packages_json: ${{ steps.set.outputs.packages_json }}
    steps:
      - id: set
        run: |
          PACKAGES="robotops_trace_semconv robotops_trace_rclcpp robotops_trace_bt_cpp robotops_trace_ros2_control robotops_trace_moveit"
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          # JSON array form for any consumer that wants it.
          JSON=$(printf '%s\n' ${PACKAGES} | jq -R . | jq -cs .)
          echo "packages_json=${JSON}" >> "$GITHUB_OUTPUT"
          echo "Releasable packages (topo order): ${PACKAGES}"

  build-packages:
    runs-on: ${{ matrix.target.runner }}
    needs: [guard, prepare]
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        # Matrix is over TARGETS only. Each job builds the full allowlist
        # (needs.prepare.outputs.packages) in topological order on ONE runner so
        # in-repo sibling dependencies are available: each freshly built deb is
        # installed before the next (dependent) package builds. See release.yml
        # for the arch/distro rationale. jazzy → Noble (amd64 + arm64);
        # humble → Jammy, arm64 only for dev pre-releases.
        target:
          - { arch: amd64, runner: ubuntu-24.04,     ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: jazzy,  os_version: noble }
          - { arch: arm64, runner: ubuntu-24.04-arm, ros_distro: humble, os_version: jammy }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image (${{ matrix.target.ros_distro }}/${{ matrix.target.arch }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: base
          push: false
          load: true
          tags: rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          build-args: |
            APT_REPO_URL=${{ env.APT_REPO_URL }}
            ROS_DISTRO=${{ matrix.target.ros_distro }}
          cache-from: type=gha,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}

      # Dependency-aware, deps-first build (ROB-437). Build each allowlisted
      # package's deb in topological order on this single runner. After each
      # package builds, its deb is installed into the image so that dependent
      # packages (e.g. rclcpp → semconv) resolve the sibling at rosdep AND at
      # cmake find_package() time. The robotops_trace_semconv rosdep rule baked
      # into the Dockerfile maps the key to the now-installed deb.
      - name: Bloom + build Debian packages (deps-first)
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          ROS_DISTRO: ${{ matrix.target.ros_distro }}
          OS_VERSION: ${{ matrix.target.os_version }}
        run: |
          docker run --rm \
            -e PACKAGES \
            -e ROS_DISTRO \
            -e OS_VERSION \
            -v ${{ github.workspace }}:/ws/src/robotops-trace-integrations \
            -v ${{ github.workspace }}/packages-out:/output \
            rti:build-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }} bash -c '
              set -eo pipefail
              cd /ws
              rosdep update
              # Refresh the apt index so (a) the skip-already-published check
              # below sees versions published by earlier release runs and (b) the
              # SDK-core upgrade right after sees the latest core.
              apt-get update
              # Force the RobotOps SDK core to the latest published version.
              # WHY: rosdep install only installs MISSING deps — it will NOT
              # upgrade an already-satisfied package to meet a version_gte
              # constraint. The cached rti:build base image baked
              # ros-${ROS_DISTRO}-robotops-trace-cpp at whatever version existed
              # when it was built (e.g. 0.2.0), so ros2_control/moveit (which
              # build-depend on robotops_trace_cpp >= 0.3.0) failed
              # dpkg-checkbuilddeps against the stale installed 0.2.0 core. A
              # plain `apt-get install` upgrades the already-installed core to the
              # current candidate, so the version_gte build-deps resolve.
              apt-get install -y ros-${ROS_DISTRO}-robotops-trace-cpp
              REPO=src/robotops-trace-integrations
              for pkg in $PACKAGES; do
                pkgdir="$REPO/packages/$pkg"
                ver=$(grep -oP "(?<=<version>)[^<]+" "$pkgdir/package.xml")
                dashed=$(echo "$pkg" | tr "_" "-")
                aptname="ros-${ROS_DISTRO}-${dashed}"
                debver="${ver}-0${OS_VERSION}"
                # Skip-already-published (ROB-437 idempotency). aptly versions are
                # immutable (name+version+arch frozen), so re-publishing an
                # existing (name, version) is rejected — and rebuilding it wastes
                # the runner and can fail on a flaky in-build test before the NEW
                # packages are ever reached. If this exact deb is already in
                # apt.development for this distro/arch, skip build+publish. The
                # skipped package stays RESOLVABLE for dependents: they pull it
                # from apt at rosdep time (the Dockerfile rosdep rule maps the
                # in-repo key to ros-<distro>-<dashed>), so deps-first ORDER is
                # preserved for the packages that DO build.
                if apt-cache madison "$aptname" 2>/dev/null | grep -qF "| ${debver} |"; then
                  echo "skip $pkg $ver (already published as ${aptname}=${debver})"
                  continue
                fi
                echo "::group::Building $pkg $ver ($ROS_DISTRO/$OS_VERSION)"
                # rosdep over the single package; in-repo sibling keys resolve via
                # the Dockerfile rosdep rules to debs installed earlier in this
                # loop OR already-published siblings pulled from apt.development.
                rosdep install --from-paths "$pkgdir" --ignore-src -r -y \
                  --rosdistro "$ROS_DISTRO" \
                  --skip-keys "robotops_trace_python ament_python"
                # DEB_BUILD_OPTIONS=nocheck makes the in-build ctest/pytest phase
                # non-fatal-by-intent: a flaky in-build test (e.g. semconv pytest
                # not finding its install-space module, ModuleNotFoundError) must
                # never block a release. The package real test gate is the ci
                # workflow (colcon test on every PR), not the deb build.
                ( cd "$pkgdir" \
                  && bloom-generate rosdebian --os-name ubuntu \
                       --os-version "$OS_VERSION" --ros-distro "$ROS_DISTRO" \
                  && DEB_BUILD_OPTIONS=nocheck dpkg-buildpackage -us -uc -b )
                # dpkg-buildpackage drops the .deb in the package PARENT dir.
                for deb in "$REPO/packages/"*.deb; do
                  echo "Built $deb"
                  cp "$deb" /output/
                  # Install so dependent packages find this sibling at build time.
                  # readlink -f → absolute path so apt treats it as a local file
                  # (a bare relative path is interpreted as a package name).
                  apt-get install -y --allow-downgrades "$(readlink -f "$deb")"
                done
                rm -f "$REPO/packages/"*.deb
                echo "::endgroup::"
              done
              echo "All NEW debs:"; ls -lh /output/ 2>/dev/null || echo "(none — every allowlisted package was already published)"
            '

      - name: Upload Debian packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.target.ros_distro }}-${{ matrix.target.arch }}
          path: packages-out/*.deb
          retention-days: 1
          # A fully-idempotent re-run (every allowlisted package already
          # published) produces no new debs for this target — don't hard-fail.
          if-no-files-found: warn

  publish-dev-debian:
    runs-on: ubuntu-latest
    needs: build-packages
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download all Debian packages
        uses: actions/download-artifact@v4
        with:
          pattern: debian-packages-*
          path: ./packages-out
          merge-multiple: true

      - name: List downloaded packages
        run: ls -lh ./packages-out/

      - name: Publish Debian packages to S3
        uses: ./.github/actions/publish-debian-s3
        with:
          deb-files: './packages-out/*.deb'
          apt-bucket: ${{ env.APT_BUCKET }}
          cloudfront-distribution-id: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Summary
        run: |
          echo "## Debian Package Publishing (Development)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for deb in ./packages-out/*.deb; do
            echo "- $(basename $deb)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ APT Repository: https://apt.development.robotops.com" >> $GITHUB_STEP_SUMMARY

  # Tag AFTER a successful publish (ROB-437). Previously tag-packages ran before
  # the build, so a failed build/publish left dangling per-package tags +
  # GitHub releases that blocked re-release (the skip-if-exists check matched the
  # stale tag). Now tags are created only once the debs are actually published,
  # and only for the implemented allowlist. Idempotent: existing tags are
  # skipped so a re-run after a partial publish fills in the gaps.
  tag-packages:
    runs-on: ubuntu-latest
    needs: [prepare, publish-dev-debian]
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create per-package dev pre-release tags (post-publish)
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          for pkg in $PACKAGES; do
            ver=$(grep -oP '(?<=<version>)[^<]+' "packages/${pkg}/package.xml")
            tag="${pkg}/v${ver}-development-${SHA}"
            if git ls-remote --tags origin | grep -q "refs/tags/${tag}$"; then
              echo "Tag ${tag} already exists — skipping."
              continue
            fi
            echo "Tagging ${tag}"
            gh release create "${tag}" \
              --title "${pkg} v${ver} (development ${SHA})" \
              --notes "Development pre-release of ${pkg} v${ver}. Debs: ${APT_REPO_URL}" \
              --prerelease \
              || echo "::warning::Failed to create pre-release for ${tag}"
          done
