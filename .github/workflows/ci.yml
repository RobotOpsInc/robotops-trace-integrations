name: CI

on:
  push:
    branches: ['feature/**', '[0-9]*']

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One entry per (ROS distro, arch). ros_distro selects the
        # ros:<distro>-ros-base base image (Dockerfile ROS_DISTRO build-arg) +
        # the sourced /opt/ros/<distro> underlay; the runner arch must match the
        # distro target so the colcon build links the right ABI.
        #   - jazzy  → Ubuntu 24.04 Noble, amd64 (the current target).
        #   - humble → Ubuntu 22.04 Jammy, arm64 (the Jetson target).
        include:
          - ros_distro: jazzy
            runner: ubuntu-latest
          - ros_distro: humble
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The C++ SDK core (ros-<distro>-robotops-trace-cpp) is published to the
      # development apt channel, so PR CI builds against APT_REPO_URL=
      # https://apt.development.robotops.com (the Dockerfile keeps the prod
      # apt.robotops.com default for release builds). The Python SDK core
      # (robotops-trace on PyPI) is not published yet; it is only an exec_depend
      # of the ament_python robotops_trace_rclpy package, which colcon still
      # builds without it (the Dockerfile rosdep step --skip-keys it).
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: test
          push: false
          load: true
          tags: robotops-trace-integrations:ci-${{ matrix.ros_distro }}
          build-args: |
            APT_REPO_URL=https://apt.development.robotops.com
            ROS_DISTRO=${{ matrix.ros_distro }}
          cache-from: type=gha,scope=${{ matrix.ros_distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.ros_distro }}

      - name: Run CI suite (build, test) for the whole workspace
        run: |
          docker run --rm \
            -v $PWD:/workspace/src/robotops-trace-integrations \
            -v ci-build:/workspace/build \
            -v ci-install:/workspace/install \
            -w /workspace/src/robotops-trace-integrations \
            --entrypoint "" \
            robotops-trace-integrations:ci-${{ matrix.ros_distro }} \
            just ci-inner

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.ros_distro }}
          path: |
            build/**/test_results/**/*.xml
            build/**/Testing/**/*
